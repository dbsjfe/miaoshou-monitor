name: 云端推送测试

on:
  schedule:
    - cron: "*/2 * * * *"
  workflow_dispatch:

jobs:
  test-push:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: 发送测试推送
        env:
          KEY: ${{ secrets.SERVERCHAN_SEND_KEY }}
        run: curl -s -X POST "https://sctapi.ftqq.com/${KEY}.send" -d "title=云端推送测试" -d "desp=来自 GitHub Actions 云端的测试推送。即使电脑已睡眠也能收到。时间: $(date +%Y-%m-%d\ %H:%M:%S)"
