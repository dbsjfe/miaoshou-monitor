name: 云端推送测试

on:
  repository_dispatch:
    types: [test]
  schedule:
    - cron: "*/2 * * * *"
  workflow_dispatch:

jobs:
  test-push:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: 发送测试推送
        env:
          KEY: ${{ secrets.SERVERCHAN_SEND_KEY }}
        run: |
          curl -s -X POST "https://sctapi.ftqq.com/${KEY}.send" -d "title=cloud push test" -d "desp=GitHub Actions cloud test. Works even if Mac is asleep. Time: $(date +%Y-%m-%d_%H:%M:%S)"
