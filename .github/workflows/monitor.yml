name: 妙手ERP订单通知（云端接管）

on:
  schedule:
    # GitHub cron 用 UTC。名义上每 10 分钟一次。
    #
    # ⚠️ 实测（2026-09-10）：GitHub 的 schedule 是**尽力而为**，不是准时任务。
    #    本仓库原用 */5，实际触发频率只有约 250 次/天（理论 288），
    #    近一周更掉到 6~9 次/天，间隔 2~5 小时；官方文档也写明
    #    「高负载时排队任务可能被直接丢弃」。
    #    所以：**准时靠本机 monitor（3 分钟轮询），云端只当宽松兜底**。
    #
    # 刻意避开 :00 / :30 —— 这两个分钟位是全 GitHub 的拥堵高峰。
    # 用冷门分钟（7/17/27/37/47/57）触发率明显更高。
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch:
    inputs:
      test_push:
        description: "只跑链路自检（发一条测试通知，不查订单）"
        type: boolean
        default: false

# 避免两轮重叠导致重复推送
concurrency:
  group: miaoshou-notify
  cancel-in-progress: false

permissions:
  contents: write          # 需要把 state/cloud_state.json 提交回仓库

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install requests

      # 手动触发时勾选「只跑链路自检」→ 发一条测试通知就结束。
      # 用途：改过 Secrets / 换过授权码之后，确认消息真的送得出去。
      # 推送失败是静默的，不主动自检很容易等到"漏单"才发现。
      - name: 链路自检
        if: ${{ inputs.test_push }}
        env:
          MIAOSHOU_APP_KEY: ${{ secrets.MIAOSHOU_APP_KEY }}
          MIAOSHOU_APP_SECRET: ${{ secrets.MIAOSHOU_APP_SECRET }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_TO: ${{ secrets.SMTP_TO }}
        run: python local/test_push.py

      - name: 推送新订单 / 日报兜底
        if: ${{ !inputs.test_push }}
        env:
          MIAOSHOU_APP_KEY: ${{ secrets.MIAOSHOU_APP_KEY }}
          MIAOSHOU_APP_SECRET: ${{ secrets.MIAOSHOU_APP_SECRET }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_TO: ${{ secrets.SMTP_TO }}
        run: python run.py

      - name: 提交状态文件（去重的依据）
        if: ${{ always() && !inputs.test_push }}
        run: |
          set -e
          if [ ! -f state/cloud_state.json ]; then
            echo "本轮没有产生状态变更，跳过提交"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/cloud_state.json
          if git diff --cached --quiet; then
            echo "状态文件无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore(state): 云端已推名单更新 [skip ci]"
          # 本机可能同时用 API 写过 state/local_state.json，push 前先 rebase
          for i in 1 2 3; do
            if git push; then
              echo "✅ 状态已提交"
              exit 0
            fi
            echo "push 被拒（第 $i 次），rebase 后重试"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME:-main}" || true
            sleep 3
          done
          echo "❌ 状态提交失败，但订单通知已发出，不影响本次推送"
